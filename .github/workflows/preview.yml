name: preview.yml
on:
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  id-token: write
  attestations: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.MORINOPARTY_CI_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MORINOPARTY_CI_AWS_SECRET_ACCESS_KEY }}
  AWS_EC2_METADATA_DISABLED: true
  AWS_REGION: ${{ secrets.MORINOPARTY_CI_AWS_REGION }}
  AWS_CLI_FILE_ENCODING: UTF-8
  AWS_DEFAULT_S3_SIGNATURE_VERSION: s3v4
  S3_UPLOAD_BUCKET: ${{ secrets.MORINOPARTY_CI_S3_UPLOAD_BUCKET }}
  S3_ENDPOINT: ${{ secrets.MORINOPARTY_CI_S3_ENDPOINT }}
  S3_PUBLIC_URL: ${{ secrets.MORINOPARTY_CI_S3_PUBLIC_URL }}
  PROJECT_NAME: MineStamp

jobs:
  # 共通の前処理：コミットSHAを取得
  setup:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short HEAD)
          echo "commit_sha=$calculatedSha" >> $GITHUB_OUTPUT

  # Gradle ビルドジョブ（docs と並列実行）
  build-gradle:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      attestation_url: ${{ steps.attest.outputs.attestation-url }}
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（setup-gradle を使用）
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: change plugin.yml version
        run: |
          sed -i "s/versionPlaceholder/${{ env.COMMIT_SHORT_SHA }}/" ./build.gradle.kts

      - name: Build with Gradle
        run: ./gradlew build

      - name: Prepare Gradle artifacts
        run: |
          mkdir -p ./gradle-artifacts/jars
          mv ./build/libs/${{ env.PROJECT_NAME }}-*-all.jar ./gradle-artifacts/jars/${{ env.PROJECT_NAME }}-${{ env.COMMIT_SHORT_SHA }}.jar

      # GitHub Attestations で署名
      - name: Attest JAR artifacts
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: './gradle-artifacts/jars/*.jar'

      - name: Upload Gradle artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-artifacts
          path: ./gradle-artifacts
          retention-days: 1

  # Docs ビルドジョブ（gradle と並列実行）
  build-docs:
    needs: setup
    runs-on: ubuntu-latest
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: 10
          run_install: false

      # pnpm キャッシュの設定
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install

      - name: Build Fumadocs
        working-directory: docs
        env:
          BASE_PATH: /minestamp/${{ env.COMMIT_SHORT_SHA }}/docs
        run: pnpm run build

      - name: Upload docs artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-artifacts
          path: ./docs/out
          retention-days: 1

  # S3 アップロードジョブ（JAR・Docs）
  upload-s3:
    needs: [setup, build-gradle, build-docs]
    # Dependabot の実行と fork からの PR には Actions の secret（MORINOPARTY_CI_* の S3 の認証情報）が渡らないため、アップロードしない。
    # comment ジョブもこのジョブに依存しているので一緒にスキップされる
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts

      - name: Prepare upload directory
        run: |
          mkdir -p ./upload
          cp -r ./artifacts/gradle-artifacts/jars ./upload/ || echo "No JAR artifacts"
          mkdir -p ./upload/docs
          mv ./artifacts/docs-artifacts/* ./upload/docs/

      # rclone の最新リリースを入れる (apt の 1.60 は R2 への転送で NotImplemented が多発する)。
      # 取得したバイナリは actions のキャッシュに保存され、アクション自体の更新は Dependabot が行う
      - uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      # aws s3 cp はファイルごとの処理が遅く、--only-show-errors では進捗も出ないため rclone で送る。
      # rclone は単一プロセスで接続を再利用しながら高い並列数で転送し、5 秒ごとに進捗をログに出す
      - name: Upload to S3
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: Cloudflare
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ env.AWS_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
        run: |
          # secret が空のまま進むと、誤ったキーにアップロードしたり PR コメントの URL が壊れたりするため止める
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_ENDPOINT S3_UPLOAD_BUCKET S3_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty (check the MORINOPARTY_CI_* organization secrets)"
              exit 1
            fi
          done

          # xargs から起動する sh でも参照できるよう export する。
          # docs の BASE_PATH (/minestamp/<sha>/docs) と揃えるため、プレフィックスは小文字の minestamp のままにする
          export PREFIX="minestamp/${COMMIT_SHORT_SHA}"

          # JAR・Docs をまとめて 1 プロセスで送る
          rclone copy ./upload "s3:${S3_UPLOAD_BUCKET}/${PREFIX}" \
            --transfers=32 --checkers=32 --stats=5s --stats-one-line -v

          # 公開ドメインはディレクトリの URL から index.html を自動で解決しない。
          # Fumadocs は trailingSlash: true でリンクが末尾スラッシュになるので、各 index.html を
          # 末尾スラッシュのキーとしても置き、リンク先や直接開いた URL が 404 にならないようにする
          find ./upload/docs -name index.html -print0 \
            | xargs -0 -P 16 -I {} sh -c '
                relative="${1#./upload/docs/}"
                aws s3api put-object \
                  --bucket "$S3_UPLOAD_BUCKET" \
                  --key "$PREFIX/docs/${relative%index.html}" \
                  --body "$1" \
                  --content-type "text/html; charset=utf-8" \
                  --endpoint-url "$S3_ENDPOINT" > /dev/null
              ' _ {}

          echo "S3 upload completed"

  # コメント作成ジョブ
  comment:
    needs: [setup, build-gradle, upload-s3]
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' || github.event.action == 'synchronize' }}
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Gradle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gradle-artifacts
          path: ./artifacts/gradle-artifacts

      # コメントに載せる JAR のサイズを計算する
      - name: Get JAR size
        id: jar-size
        run: |
          # バイト数を読みやすい単位に変換する (1 MiB 以上は MB、それ未満は KB)
          human_size() {
            local bytes
            bytes=$(stat -c %s "$1")
            if [ "$bytes" -ge 1048576 ]; then
              awk -v b="$bytes" 'BEGIN { printf "%.1f MB", b / 1048576 }'
            else
              awk -v b="$bytes" 'BEGIN { printf "%.1f KB", b / 1024 }'
            fi
          }
          JARS=./artifacts/gradle-artifacts/jars
          echo "plugin=$(human_size "$JARS/${{ env.PROJECT_NAME }}-${{ env.COMMIT_SHORT_SHA }}.jar")" >> $GITHUB_OUTPUT

      - name: Get limit time
        id: limit-time
        run: |
          limit_time=$(date -d "7 days" +%Y-%m-%d)
          echo "LIMIT_TIME=$limit_time" >> $GITHUB_ENV

      - name: Create comment file
        env:
          JAR_BASE_URL: "${{ env.S3_PUBLIC_URL }}/minestamp/${{ env.COMMIT_SHORT_SHA }}/jars"
          DOCS_PREVIEW_URL: "${{ env.S3_PUBLIC_URL }}/minestamp/${{ env.COMMIT_SHORT_SHA }}/docs/index.html"
          ATTESTATION_URL: "${{ needs.build-gradle.outputs.attestation_url }}"
          LIMIT_TIME: ${{ env.LIMIT_TIME }}
        run: |
          cat << EOF > comment.md
          ## 🚀 Preview of ${{ github.event.repository.name }}

          ### 📦 Preview JARs
          Available for 7 days (until $LIMIT_TIME)
          | Artifact | Download | Size |
          |----------|----------|------|
          | Plugin | [${{ env.PROJECT_NAME }}-${{ env.COMMIT_SHORT_SHA }}.jar]($JAR_BASE_URL/${{ env.PROJECT_NAME }}-${{ env.COMMIT_SHORT_SHA }}.jar) | ${{ steps.jar-size.outputs.plugin }} |

          > 📜 **Attestation** (SLSA provenance): [Verify on GitHub]($ATTESTATION_URL) or run \`gh attestation verify <jar-file> --owner morinoparty\`

          ### 📖 Documentation
          Available for 7 days (until $LIMIT_TIME)
          | Resource | Link |
          |----------|------|
          | 📖 Documentation | [Preview]($DOCS_PREVIEW_URL) |

          ### 🦉 In-game screenshots
          <!-- fukurou:start -->
          ⏳ Running… (updated by the Game test workflow when it finishes)
          <!-- fukurou:end -->
          EOF

      - name: Create PR comment
        run: gh pr comment ${{ github.event.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
