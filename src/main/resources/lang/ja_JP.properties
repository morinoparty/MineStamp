# MineStamp 日本語メッセージ
# 書式: MiniMessage (https://docs.advntr.dev/minimessage/format.html)
# 引数は <arg:0>, <arg:1>, ... で参照します

# --- 汎用 ---
minestamp.only-execute-from-player=<red>このコマンドはプレイヤーのみ実行できます。</red>

# --- スタンプ召喚 ---
minestamp.cannot-summon-in-a-row=<red>スタンプを連続で召喚することはできません。前のスタンプの出現から<arg:0>秒待つ必要があります。</red>
minestamp.not-have-the-emoji=<red>そのスタンプを持っていません。</red>

# --- スタンプ一覧 ---
minestamp.current-emoji-list=<green>現在使用できるスタンプ一覧:</green>

# --- ヘルプ ---
minestamp.help.header=<green>===== MineStamp ヘルプ =====</green>
minestamp.help.stamp=<gold>/stamp [スタンプ]</gold> <gray>- 所持しているスタンプを召喚します</gray>
minestamp.help.list=<gold>/minestamp list</gold> <gray>- 使用できるスタンプの一覧を表示します</gray>
minestamp.help.help=<gold>/minestamp help</gold> <gray>- このヘルプを表示します</gray>
minestamp.help.advance=<gold>/minestamp advance [スタンプ] [秒数] [サイズ] [パーティクルサイズ] [精度]</gold> <gray>- パラメータを指定してスタンプを召喚します</gray>
minestamp.help.publish-roulette=<gold>/minestamp publish roulette</gold> <gray>- ルーレットチケットを発行します</gray>
minestamp.help.publish-unique=<gold>/minestamp publish unique [スタンプ]</gold> <gray>- 指定したスタンプのチケットを発行します</gray>
minestamp.help.generate-keypair=<gold>/minestamp generate keyPair</gold> <gray>- チケット署名用の鍵ペアを生成します</gray>
minestamp.help.reload=<gold>/minestamp reload</gold> <gray>- コンフィグを再読み込みします</gray>
minestamp.help.purge=<gold>/minestamp purge</gold> <gray>- 描画できない絵文字を全プレイヤーデータとrandom.jsonから完全に削除します</gray>
minestamp.help.url=<green><click:open_url:'https://minestamp.nikomaru.page/ja'><u>クリックしてオンラインガイドを開く</u></click></green>

