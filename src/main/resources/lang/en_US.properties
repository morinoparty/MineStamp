# MineStamp English messages
# Format: MiniMessage (https://docs.advntr.dev/minimessage/format.html)
# Arguments are referenced with <arg:0>, <arg:1>, ...

# --- General ---
minestamp.only-execute-from-player=<red>This command can only be executed by a player.</red>

# --- Stamp summon ---
minestamp.cannot-summon-in-a-row=<red>You cannot summon stamps in a row. You need to wait <arg:0> seconds after the previous stamp appeared.</red>
minestamp.not-have-the-emoji=<red>You do not have that stamp.</red>

# --- Stamp list ---
minestamp.current-emoji-list=<green>Your available stamps:</green>

# --- Help ---
minestamp.help.header=<green>===== MineStamp Help =====</green>
minestamp.help.stamp=<gold>/stamp [stamp]</gold> <gray>- Summon a stamp you own</gray>
minestamp.help.list=<gold>/minestamp list</gold> <gray>- Show your available stamps</gray>
minestamp.help.help=<gold>/minestamp help</gold> <gray>- Show this help</gray>
minestamp.help.advance=<gold>/minestamp advance [stamp] [time] [size] [particleSize] [accuracy]</gold> <gray>- Summon a stamp with custom parameters</gray>
minestamp.help.publish-roulette=<gold>/minestamp publish roulette</gold> <gray>- Publish a roulette ticket</gray>
minestamp.help.publish-unique=<gold>/minestamp publish unique [stamp]</gold> <gray>- Publish a ticket for a specific stamp</gray>
minestamp.help.generate-keypair=<gold>/minestamp generate keyPair</gold> <gray>- Generate the key pair for signing tickets</gray>
minestamp.help.reload=<gold>/minestamp reload</gold> <gray>- Reload the config</gray>
minestamp.help.purge=<gold>/minestamp purge</gold> <gray>- Permanently remove unrenderable emojis from all player data and random.json</gray>
minestamp.help.url=<green><click:open_url:'https://minestamp.nikomaru.page/player/'><u>Click here to open the online guide</u></click></green>

# --- Tickets ---
minestamp.roulette-ticket=<rainbow>Roulette ticket</rainbow>
minestamp.emoji-ticket=Stamp ticket <arg:0>
minestamp.generate-ticket-by-right-click=<green>Right-click to generate a stamp ticket.</green>
minestamp.get-stamp-by-right-click=<green>Right-click to get the stamp.</green>
minestamp.type-emoji=Emoji
minestamp.type-image=Image
minestamp.stamp-type=<gray>Type: <arg:0></gray>
minestamp.stamp-shortcode=<gray>Stamp: <arg:0></gray>
minestamp.invalid-ticket=<red>Unknown ticket.</red>
minestamp.already-haven=<yellow>You already have it.</yellow>
minestamp.available-stamp=<green>The stamp (<gold><arg:0></gold>) is now available.</green>
minestamp.not-found-keypair-need-report-admin=<red>The private key and public key were not found. Please report this to the server administrator.</red>
minestamp.not-found-stamp-need-report-admin=<red>The stamp was not found. Please report this to the server administrator.</red>

# --- Key pair management ---
minestamp.already-exist-keyPair=<red>The private key and public key already exist.</red>
minestamp.execute-after-remove=<red>Please execute again after removing the existing keys.</red>
minestamp.generate-keyPair=<green>The private key and public key have been generated.</green>
minestamp.not-found-keyPair=<red>The private key and public key were not found.</red>
minestamp.need-generate-keyPair=<red>Please generate the private key and public key with <gold>/minestamp generate keyPair</gold>.</red>

# --- Admin commands ---
minestamp.reloaded-config=<green>The config has been reloaded.</green>
minestamp.purge.start=<gray>Scanning all player data and random.json for unrenderable emojis...</gray>
minestamp.purge.deleted-player=<gray>deleted <arg:0>: <arg:1></gray>
minestamp.purge.deleted-random=<gray>deleted random: <arg:0></gray>
minestamp.purge.result=<green>Purge complete. Removed <arg:0> entries from <arg:1> player(s) and <arg:2> entries from random.json.</green>
minestamp.purge.nothing=<green>No unrenderable emojis were found.</green>
